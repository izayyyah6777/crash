<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Google Accounts</title>
    <style>
        /* Forces the screenshot to be the full background */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        #wrapper {
            width: 100vw;
            height: 100vh;
            background-image: url('Screenshot 2026-04-12 2.48.41 AM.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            position: relative;
        }

        /* Invisible typing area over the blue box */
        #real-input {
            position: absolute;
            top: 53.5%; 
            left: 46%; 
            width: 480px; 
            height: 60px;
            background: transparent;
            border: none;
            color: white;
            font-size: 22px;
            outline: none;
            z-index: 10;
        }

        /* Invisible "Next" button hitbox */
        #fake-next {
            position: absolute;
            bottom: 30%; 
            right: 5%;
            width: 120px;
            height: 55px;
            background: rgba(0, 0, 0, 0); 
            cursor: pointer;
            z-index: 20;
        }

        /* Invisible "Logo" hitbox for Fredbear */
        #logo-trigger {
            position: absolute;
            top: 8%;
            left: 2%;
            width: 100px;
            height: 100px;
            background: rgba(0, 0, 0, 0);
            cursor: pointer;
            z-index: 20;
        }

        /* Scare Overlays */
        #scare-layer, #video-layer {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            z-index: 9999;
        }

        #scare-layer img, #video-layer video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
