<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>invincrash</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            overflow: hidden; background-color: black;
            display: flex; justify-content: center; align-items: center;
            user-select: none; 
        }

        #bg-video {
            /* Locked 1:1 Square */
            width: 85vh; height: 85vh;
            max-width: 95vw; max-height: 95vh;
            object-fit: contain;
            z-index: 1;
            image-rendering: pixelated;
        }

        /* Deep-fry glitch: No glow, no blur, no scale */
        .frozen-glitch {
            filter: contrast(4.5) saturate(3) brightness(1.1) !important;
        }

        #fps-display {
            position: absolute; top: 15px; left: 15px;
            color: #00FF00; font-family: monospace; font-size: 18px;
            z-index: 10; background: rgba(0, 0, 0, 0.7);
            padding: 5px; pointer-events: none;
        }

        #overlay {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); color: white;
            display: flex; justify-content: center; align-items: center;
            z-index: 100; cursor: pointer; font-family: sans-serif;
            font-weight: bold; font-size: 24px;
        }

        #scare-layer {
            display: none; position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: black; z-index: 9999;
        }

        #scare-layer img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
