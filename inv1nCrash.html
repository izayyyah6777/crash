<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>invincrash</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: black;
            user-select: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #darkness-trap {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: black;
            z-index: 0;
        }

        /* The Box: Locked to 1:1 and centered */
        .video-box {
            position: relative; 
            width: 90vh; /* Keeps the square edit fully visible */
            height: 90vh;
            max-width: 95vw;
            max-height: 95vh;
            z-index: 1;
            background: #000;
            overflow: hidden;
        }

        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
            object-fit: contain;
            image-rendering: pixelated;
        }

        #ghost-video {
            display: none;
            opacity: 0.7;
            mix-blend-mode: color-dodge;
            pointer-events: none;
            z-index: 2;
        }

        /* The 144p Smash */
        .glitch-active {
            filter: contrast(1.8) saturate(1.5) brightness(1.2) !important;
            transform: scale(0.20); 
        }
