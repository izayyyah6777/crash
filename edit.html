<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glitch Loop</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #bg-video {
            /* Fixes the oversized issue */
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            z-index: 1;
            /* 360p effect */
            filter: blur(1px) contrast(1.1) brightness(0.9);
        }

        #fps-display {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #00FF00;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 5px;
            pointer-events: none;
        }

        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            cursor: pointer;
            font-family: sans-serif;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="overlay">CLICK TO START</div>
    <div id="fps-display">FPS: <span id="fps-num">200</span></div>

    <video id="bg-video" loop playsinline>
        <source src="AhaTok_sight.edits_84d687cc-4179-4f72-a710-028686bc0ca2_.mp4" type="video/mp4">
    </video>

    <script>
        const video = document.getElementById("bg-video");
        const overlay = document.getElementById("overlay");
        const fpsNum = document.getElementById("fps-num");

        overlay.addEventListener('click', () => {
            video.muted = false;
            video.play();
            overlay.style.display = "none";
            startGlitchLogic();
        });

        function startGlitchLogic() {
            // Main loop for FPS and Freezing
            setInterval(() => {
                let isFreezing = Math.random() > 0.96; // 4% chance to freeze every 100ms
                
                if (isFreezing) {
                    video.pause();
                    fpsNum.innerText = "0";
                    fpsNum.style.color = "red";
                    
                    // Stay frozen for a random short time (100ms to 500ms)
                    setTimeout(() => {
                        video.play();
                        fpsNum.style.color = "#00FF00";
                    }, Math.random() * 400 + 100);
                    
                } else {
                    // Normal FPS jitter
                    let val = Math.floor(Math.random() * (205 - 190 + 1)) + 190;
                    fpsNum.innerText = val;
                }
            }, 100);
        }
    </script>

</body>
</html>
