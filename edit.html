<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-Speed Loop (Audio Forced)</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
        }

        #bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            z-index: 1;
            transform: translate(-50%, -50%);
            object-fit: contain; 
            filter: blur(1px) contrast(1.1);
        }

        /* This is an invisible layer that catches the first click to trigger audio */
        #audio-trigger {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            cursor: pointer;
        }

        #fps-display {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #00FF00;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="audio-trigger"></div>

    <div id="fps-display">FPS: <span id="fps-num">200</span></div>

    <video id="bg-video" autoplay loop muted playsinline>
        <source src="AhaTok_sight.edits_84d687cc-4179-4f72-a710-028686bc0ca2_.mp4" type="video/mp4">
    </video>

    <script>
        const video = document.getElementById("bg-video");
        const trigger = document.getElementById("audio-trigger");
        const fpsNum = document.getElementById("fps-num");

        // FORCE AUDIO ON FIRST CLICK
        trigger.addEventListener('click', () => {
            video.muted = false;
            video.volume = 1.0; // Max volume
            video.play();
            trigger.style.display = "none"; // Remove the layer after it works
        });

        // Fake FPS logic
        setInterval(() => {
            let val = Math.floor(Math.random() * (202 - 198 + 1)) + 198;
            if (Math.random() > 0.98) {
                val = 0;
                fpsNum.style.color = "red";
            } else {
                fpsNum.style.color = "#00FF00";
            }
            fpsNum.innerText = val;
        }, 100);
    </script>

</body>
</html>
