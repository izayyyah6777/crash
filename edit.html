<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed Loop</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #bg-video {
            /* Fixes the "oversized" issue: fits perfectly inside the screen */
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            z-index: 1;
            /* 360p vibe */
            filter: blur(1px) contrast(1.1);
        }

        /* Fake FPS */
        #fps-display {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #00FF00;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 5px;
        }

        /* The Overlay to force Audio */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            cursor: pointer;
            font-family: sans-serif;
            font-weight: bold;
            font-size: 24px;
        }
    </style>
</head>
<body>

    <div id="overlay">CLICK TO START</div>
    <div id="fps-display">FPS: <span id="fps-num">200</span></div>

    <video id="bg-video" loop playsinline>
        <source src="AhaTok_sight.edits_84d687cc-4179-4f72-a710-028686bc0ca2_.mp4" type="video/mp4">
    </video>

    <script>
        const video = document.getElementById("bg-video");
        const overlay = document.getElementById("overlay");
        const fpsNum = document.getElementById("fps-num");

        // When they click the "Start" screen, it forces the video to play with audio
        overlay.addEventListener('click', () => {
            video.muted = false;
            video.play();
            overlay.style.display = "none";
        });

        // Fake FPS jitter
        setInterval(() => {
            let val = Math.floor(Math.random() * (205 - 195 + 1)) + 195;
            if (Math.random() > 0.99) { val = 0; fpsNum.style.color = "red"; } 
            else { fpsNum.style.color = "#00FF00"; }
            fpsNum.innerText = val;
        }, 100);
    </script>

</body>
</html>
