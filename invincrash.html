<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>invincrash</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: black;
            user-select: none; 
        }

        /* The "Darkness" Trap - Covers everything behind the video */
        #darkness-trap {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: black;
            z-index: 0; /* Behind the video */
            cursor: default;
        }

        #bg-video {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 100%;
            max-height: 100%;
            z-index: 1; /* Above the trap */
            filter: blur(1px) contrast(1.1);
            pointer-events: auto; /* Video stays clickable for replays */
        }

        .low-res {
            filter: blur(8px) contrast(1.4) brightness(1.1) !important;
            image-rendering: pixelated;
        }

        /* Jumpscare / Error Container */
        #scare-layer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0000aa; /* Blue screen */
            z-index: 9999;
            color: white;
            font-family: 'Courier New', monospace;
            text-align: center;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        #scare-layer img {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
        }

        #fps-display {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #00FF00;
            font-family: monospace;
            font-size: 18px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 5px;
            pointer-events: none;
        }

        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            cursor: pointer;
            font-size: 24px;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="darkness-trap"></div> <div id="scare-layer">
        <img src="jumpscare.jpg" alt="CRASHED">
        <h1 style="position:absolute; top: 10px; width: 100%;">FATAL_ERROR: 0x0006777</h1>
    </div>

    <div id="overlay">CLICK TO START</div>
    <div id="fps-display">FPS: <span id="fps-num">200</span></div>

    <video id="bg-video" loop playsinline disablePictureInPicture>
        <source src="AhaTok_sight.edits_84d687cc-4179-4f72-a710-028686bc0ca2_.mp4" type="video/mp4">
    </video>

    <script>
        const video = document.getElementById("bg-video");
        const overlay = document.getElementById("overlay");
        const scareLayer = document.getElementById("scare-layer");
        const darkness = document.getElementById("darkness-trap");
        const fpsNum = document.getElementById("fps-num");

        overlay.addEventListener('click', () => {
            video.muted = false;
            video.play();
            overlay.style.display = "none";
            startGlitchLogic();
        });

        // REPLAY Logic (When clicking the video)
        video.addEventListener('mousedown', (e) => {
            video.playbackRate = 1.0;
            video.classList.remove("low-res");
            video.currentTime = 0;
            video.play();
        });

        // CRASH Logic (When clicking the darkness behind the video)
        darkness.addEventListener('mousedown', () => {
            if (overlay.style.display === "none") {
                triggerCrash();
            }
        });

        function triggerCrash() {
            video.pause();
            scareLayer.style.display = "flex";
            
            // Redirect after 1.2 seconds
            setTimeout(() => {
                window.location.href = "https://www.google.com";
            }, 1200);
        }

        function startGlitchLogic() {
            setInterval(() => {
                let rng = Math.random();
                if (rng > 0.96 && video.playbackRate === 1.0) {
                    video.classList.add("low-res");
                    video.playbackRate = 0; 
                    fpsNum.innerText = "9";
                    fpsNum.style.color = "red";
                    
                    setTimeout(() => {
                        video.playbackRate = 3.0;
                        fpsNum.innerText = "600+";
                        fpsNum.style.color = "#00FFFF";
                        
                        setTimeout(() => {
                            video.playbackRate = 1.0;
                            video.classList.remove("low-res");
                            fpsNum.style.color = "#00FF00";
                        }, 300); 
                    }, Math.random() * 600 + 200); 
                } 
                if (video.playbackRate === 1.0) {
                    fpsNum.innerText = Math.floor(Math.random() * (205 - 195 + 1)) + 195;
                }
            }, 100);
        }
    </script>
</body>
</html>
