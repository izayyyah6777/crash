<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>invincrash</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: black;
            user-select: none; 
        }

        /* Darkness trap for the jumpscare */
        #darkness-trap {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: black;
            z-index: 0;
        }

        .video-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
            transition: transform 0.1s;
        }

        video {
            max-width: 100%;
            max-height: 100%;
            image-rendering: pixelated; /* Keeps it crunchy, not blurry */
        }

        /* The Ghost Layer for Smearing */
        #ghost-video {
            position: absolute;
            top: 0;
            left: 0;
            display: none;
            opacity: 0.5;
            mix-blend-mode: lighten; /* Blends frames like the YouTube example */
            pointer-events: none;
        }

        /* True 144p Crunch - No glow, just pixels */
        .low-res {
            filter: contrast(1.7) saturate(1.4) !important;
            transform: scale(0.25); /* Shrinks internally to destroy detail */
        }

        #scare-layer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            z-index: 9999;
        }

        #scare-layer img {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
        }

        #fps-display {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #00FF00;
            font-family: monospace;
            font-size: 18px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 5px;
            pointer-events: none;
        }

            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
