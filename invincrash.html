<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>invincrash</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: black;
            user-select: none; 
        }

        #darkness-trap {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: black;
            z-index: 0;
        }

        .video-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }

        video {
            max-width: 100%;
            max-height: 100%;
            image-rendering: pixelated;
        }

        /* The Ghost Frame that creates the overlap glitch */
        #ghost-video {
            position: absolute;
            top: 0;
            left: 0;
            display: none;
            opacity: 0.6;
            mix-blend-mode: screen; /* This creates the "overlap" look */
            pointer-events: none;
        }

        .low-res {
            filter: contrast(2) saturate(1.5) !important;
            transform: scale(0.2); /* Crushes resolution to 144p */
        }

        #scare-layer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            z-index: 9999;
        }

        #scare-layer img {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
        }

        #fps-display {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #00FF00;
            font-family: monospace;
            font-size: 18px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 5px;
            pointer-events: none;
        }

        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            cursor: pointer;
            font-size: 24px;
            font-family: sans-serif;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="darkness-trap"></div>

    <div id="scare-layer">
        <img src="jumpscare.jpg" alt="SYSTEM FAILURE">
    </div>

    <div id="overlay">CLICK TO START</div>
    <div id="fps-display">FPS: <span id="fps-num">200</span></div>

    <div class="video-container">
        <video id="bg-video" loop playsinline disablePictureInPicture>
            <source src="AhaTok_sight.edits_84d687cc-4179-4f72-a710-028686bc0ca2_.mp4" type="video/mp4">
        </video>
        <video id="ghost-video" loop playsinline muted></video>
    </div>

    <script>
        const video = document.getElementById("bg-video");
        const ghost = document.getElementById("ghost-video");
        const overlay = document.getElementById("overlay");
        const scareLayer = document.getElementById("scare-layer");
        const darkness = document.getElementById("darkness-trap");
        const fpsNum = document.getElementById("fps-num");

        overlay.addEventListener('click', () => {
            video.muted = false;
            ghost.src = video.querySelector('source').src;
            video.play();
            ghost.play();
            overlay.style.display = "none";
            startGlitchLogic();
        });

        // Replay Logic
        const resetVideo = () => {
            video.playbackRate = 1.0;
            video.classList.remove("low-res");
            ghost.style.display = "none";
            video.currentTime = 0;
            ghost.currentTime = 0;
            video.play();
            ghost.play();
        };

        video.addEventListener('mousedown', resetVideo);

        darkness.addEventListener('mousedown', () => {
            if (overlay.style.display === "none") {
                video.pause();
                ghost.pause();
                scareLayer.style.display = "flex";
                setTimeout(() => { window.location.href = "https://www.google.com"; }, 1200);
            }
        });

        function startGlitchLogic() {
            setInterval(() => {
                let rng = Math.random();
                
                // 5% chance to trigger the Overlap Glitch
                if (rng > 0.95) {
                    video.classList.add("low-res");
                    ghost.style.display = "block";
                    // Offset the ghost video slightly to create the overlap
                    ghost.currentTime = video.currentTime - 0.2; 
                    fpsNum.innerText = "12";
                    fpsNum.style.color = "red";
                    
                    setTimeout(() => {
                        video.classList.remove("low-res");
                        ghost.style.display = "none";
                        fpsNum.style.color = "#00FF00";
                    }, Math.random() * 800 + 200);
                } 

                if (overlay.style.display === "none") {
                    fpsNum.innerText = Math.floor(Math.random() * (205 - 195 + 1)) + 195;
                }
            }, 100);
        }
    </script>
</body>
</html>
