<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>invincrash</title> <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none; 
        }

        #bg-video {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            z-index: 1;
            filter: blur(1px) contrast(1.1);
            pointer-events: none; 
            transition: filter 0.1s ease;
        }

        /* 144p Crunch Effect */
        .low-res {
            filter: blur(8px) contrast(1.4) brightness(1.1) !important;
            image-rendering: pixelated;
        }

        #fps-display {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #00FF00;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 5px;
            pointer-events: none;
        }

        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            cursor: pointer;
            font-family: sans-serif;
            font-weight: bold;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="overlay">CLICK TO START</div>
    <div id="fps-display">FPS: <span id="fps-num">200</span></div>

    <video id="bg-video" loop playsinline disablePictureInPicture controlsList="nodownload noplaybackrate">
        <source src="AhaTok_sight.edits_84d687cc-4179-4f72-a710-028686bc0ca2_.mp4" type="video/mp4">
    </video>

    <script>
        const video = document.getElementById("bg-video");
        const overlay = document.getElementById("overlay");
        const fpsNum = document.getElementById("fps-num");

        overlay.addEventListener('click', () => {
            video.muted = false;
            video.play();
            overlay.style.display = "none";
            startGlitchLogic();
        });

        // Instant Replay on Left/Right Click
        window.addEventListener('mousedown', (e) => {
            if (overlay.style.display === "none") {
                video.playbackRate = 1.0;
                video.classList.remove("low-res");
                video.currentTime = 0;
                video.play();
            }
        });

        function startGlitchLogic() {
            setInterval(() => {
                let rng = Math.random();
                
                // Random 144p / Freeze / Speed-up logic
                if (rng > 0.96 && video.playbackRate === 1.0) {
                    video.classList.add("low-res");
                    video.playbackRate = 0; 
                    fpsNum.innerText = "9";
                    fpsNum.style.color = "red";
                    
                    setTimeout(() => {
                        video.playbackRate = 3.0;
                        fpsNum.innerText = "600+";
                        fpsNum.style.color = "#00FFFF";
                        
                        setTimeout(() => {
                            video.playbackRate = 1.0;
                            video.classList.remove("low-res");
                            fpsNum.style.color = "#00FF00";
                        }, 300); 
                        
                    }, Math.random() * 600 + 200); 
                } 
                
                if (video.playbackRate === 1.0) {
                    fpsNum.innerText = Math.floor(Math.random() * (205 - 195 + 1)) + 195;
                }
            }, 100);
        }
    </script>

</body>
</html>
