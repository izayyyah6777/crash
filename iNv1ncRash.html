<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>invincrash</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            overflow: hidden; background-color: #000;
            display: flex; justify-content: center; align-items: center;
        }

        /* Centered 1:1 Square */
        .v-container {
            position: relative;
            width: 85vh; height: 85vh;
            max-width: 95vw; max-height: 95vh;
            z-index: 5;
        }

        video {
            width: 100%; height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
            display: block;
        }

        /* Datamosh/Smear Glitch */
        .glitch {
            filter: contrast(2.5) saturate(2) brightness(1.5) blur(3px);
            transform: scale(0.35) rotate(1deg);
        }

        #overlay {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000; color: #444;
            display: flex; justify-content: center; align-items: center;
            z-index: 100; cursor: pointer; font-family: monospace;
        }

        #scare {
            display: none; position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999;
        }

        #scare img { width: 100%; height: 100%; object-fit: cover; }

        #stats {
            position: fixed; top: 10px; left: 10px;
            color: #0f0; font-family: monospace; z-index: 10;
        }
    </style>
</head>
<body>

    <div id="stats">FPS: 200</div>
    <div id="overlay" onclick="start()">[ CLICK TO INITIALIZE ]</div>
    <div id="scare"><img src="jumpscare.jpg"></div>

    <div style="position:fixed; width:100%; height:100%; z-index:1;" onmousedown="crash()"></div>

    <div class="v-container">
        <video id="v" loop playsinline
