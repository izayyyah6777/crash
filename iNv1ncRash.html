<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>invincrash</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            overflow: hidden; background-color: #000;
            display: flex; justify-content: center; align-items: center;
            user-select: none;
        }

        /* Centered 1:1 Box */
        .video-box {
            position: relative;
            width: 85vh; height: 85vh;
            max-width: 95vw; max-height: 95vh;
            background: #000;
            z-index: 5;
        }

        video {
            width: 100%; height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
        }

        /* 0:09 Datamosh Glitch */
        .glitch-active {
            filter: contrast(3) saturate(2.5) brightness(1.4) blur(4px) sepia(0.5);
            transform: scale(0.3) rotate(-2deg);
        }

        #overlay {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: black;
            color: #777; z-index: 100;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            cursor: pointer; font-family: monospace;
        }

        #scare-layer {
            display: none; position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: black; z-index: 9999;
        }

        #scare-layer img { width: 100%; height: 100%; object-fit: cover; }

        #fps {
            position: fixed; top: 10px; left: 10px;
            color: #0f0; font-family: monospace; z-index: 10;
        }
    </style>
