<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>invincrash</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            overflow: hidden; background: #000;
            display: flex; justify-content: center; align-items: center;
        }

        #wrapper {
            position: relative;
            width: 80vh; height: 80vh; /* Strictly 1:1 */
            max-width: 90vw; max-height: 90vh;
            background: #000;
            z-index: 5;
        }

        video {
            width: 100%; height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
        }

        /* 0:09 Glitch Effect */
        .mosh {
            filter: contrast(3) saturate(2) brightness(1.5) blur(5px);
            transform: scale(0.3) skewX(2deg);
        }

        #overlay {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000; color: #fff;
            display: flex; justify-content: center; align-items: center;
            z-index: 100; cursor: pointer; font-family: monospace;
        }

        #scare {
            display: none; position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999;
        }

        #scare img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

    <div id="overlay" onclick="forcePlay()">[ CLICK TO FORCE BOOT ]</div>
    <div id="scare"><img src="jumpscare.jpg"></div>

    <div id="wrapper">
        <video id="v" loop playsinline muted crossorigin="anonymous">
            <source src="./AhaTok_sight.edits_84d687cc-4179-4f72-a710-028686bc0ca2_.mp4" type="video/mp4">
        </video>
    </div>

    <script>
        const v = document.getElementById('v');
        const o = document.getElementById('overlay');
        const s = document.getElementById('scare');

        function forcePlay() {
            // Unmute and force re-load from source
            v.muted = false;
            v.load(); 
            
            let promise = v.play();

            if (promise !== undefined) {
                promise.then(() => {
                    o.style.display = "none";
                    startGlitches();
                }).catch(err => {
                    // Fail-safe: play muted if unmuted is blocked
                    v.muted = true;
                    v.play();
                    o.style.display = "none";
                });
            }
        }

        function startGlitches() {
            setInterval(() => {
                if (v.paused) return;
                if (Math.random() > 0.97) {
                    v.classList.add('mosh');
                    setTimeout(() => v.classList.remove('mosh'), 400);
                }
            }, 100);
        }

        // Click empty space to crash
        document.body.onmousedown = (e) => {
            if (e.target === document.body && o.style.display === "none") {
                v.pause();
                s.style.display = "block";
                setTimeout(() => window.location.href = "https://google.com", 1500);
            }
        };

        // Click video to reset
        v.onmousedown = (e) => {
            e.stopPropagation();
            v.currentTime = 0;
            v.play();
        };
    </script>
</body>
</html>
