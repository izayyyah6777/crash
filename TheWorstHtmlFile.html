<style>
    /* Add these new glitch animations */
    @keyframes melt {
        0% { filter: contrast(1) brightness(1); transform: scale(1); }
        50% { filter: contrast(5) brightness(1.5) blur(2px); transform: scale(1.05) skewX(5deg); }
        100% { filter: contrast(10) brightness(2) blur(8px); transform: scale(1.1) translateY(20px); opacity: 0.5; }
    }

    .melting {
        animation: melt 1.5s forwards;
        image-rendering: pixelated;
    }

    .frozen-glitch {
        filter: contrast(8) saturate(5) hue-rotate(90deg) !important;
    }
</style>

<script>
    // ... (rest of the variables stay the same)

    video.addEventListener('timeupdate', () => {
        // Trigger the "Meltdown" slightly before the hard freeze
        if (!isFrozen && video.currentTime >= (TARGET_TIME - 1.5) && video.currentTime < TARGET_TIME) {
            video.playbackRate = 2.5; // Instant speed up
            video.classList.add("melting");
        }

        if (!isFrozen && video.currentTime >= TARGET_TIME) {
            isFrozen = true;
            video.pause();
            video.playbackRate = 1; 
            video.classList.remove("melting");
            video.classList.add("frozen-glitch");
            
            fpsNum.innerText = "0.0";
            fpsNum.style.color = "red";
            
            // Randomly "flicker" the screen during the freeze
            let flicker = setInterval(() => {
                if(!isFrozen) { clearInterval(flicker); return; }
                video.style.opacity = Math.random() > 0.1 ? "1" : "0";
            }, 50);

            setTimeout(() => { 
                if (isFrozen) {
                    clearInterval(flicker);
                    video.style.opacity = "1";
                    resumeVideo(); 
                }
            }, 35000);
        }
    });
</script>
