<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>invincrash</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            overflow: hidden; background-color: black;
            display: flex; justify-content: center; align-items: center;
            user-select: none; 
        }

        #bg-video {
            width: 85vh; height: 85vh;
            max-width: 95vw; max-height: 95vh;
            object-fit: contain;
            z-index: 1;
            image-rendering: pixelated;
        }

        /* Fred video set to fill EVERYTHING */
        #fred-video {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; 
            height: 100vh;
            z-index: 5000; /* Above everything */
            background: black;
            object-fit: cover; /* This makes it fill the whole screen */
        }

        .frozen-glitch {
            filter: contrast(5) saturate(3.5) brightness(1.2) !important;
        }

        #fps-display {
            position: absolute; top: 15px; left: 15px;
            color: #00FF00; font-family: monospace; font-size: 18px;
            z-index: 1000; background: rgba(0, 0, 0, 0.7);
            padding: 5px; cursor: pointer;
            border: 1px transparent solid;
        }

        #fps-display:hover { border-color: #00FF00; }

        #overlay {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.98); color: white;
            display: flex; justify-content: center; align-items: center;
            z-index: 6000; cursor: pointer; font-family: sans-serif;
            font-weight: bold; font-size: 24px;
        }

        #scare-layer {
            display: none; position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999;
        }

        #scare-layer img { width: 100%; height: 100%; object-fit: contain; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="overlay">INITIALIZE CORE</div>
    
    <div id="fps-display" onclick="playFred(event)">FPS: <span id="fps-num">200</span></div>
    
    <audio id="scream-snd" preload="auto">
        <source src="ElevenLabs_Sudden_loud_scream_in_a_dark_hallway,_terrifying_jumpscare.mp3" type="audio/mpeg">
    </audio>

    <div id="scare-layer">
        <img src="scary.png">
    </div>

    <video id="bg-video" loop playsinline disablePictureInPicture>
        <source src="AhaTok_sight.edits_84d687cc-4179-4f72-a710-028686bc0ca2_.mp4" type="video/mp4">
    </video>

    <video id="fred-video" playsinline>
        <source src="FREDBEARDOMER.mp4" type="video/mp4">
    </video>

    <script>
        const video = document.getElementById("bg-video");
        const fred = document.getElementById("fred-video");
        const overlay = document.getElementById("overlay");
        const fpsNum = document.getElementById("fps-num");
        const scare = document.getElementById("scare-layer");
        const scream = document.getElementById("scream-snd");

        let isFrozen = false;
        const TARGET_TIME = 9.0;

        overlay.addEventListener('click', () => {
            video.muted = false;
            video.play();
            scream.load(); 
            fred.load();
            overlay.style.display = "none";
            startFPSCounter();
        });

        function playFred(e) {
            e.stopPropagation();
            video.pause();
            fred.style.display = "block";
            fred.play();
        }

        fred.onended = () => {
            window.location.href = "https://classroom.google.com";
        };

        video.addEventListener('timeupdate', () => {
            if (!isFrozen && video.currentTime >= TARGET_TIME) {
                isFrozen = true;
                video.pause();
                video.classList.add("frozen-glitch");
                fpsNum.innerText = "0.0";
                fpsNum.style.color = "red";
                setTimeout(() => { if (isFrozen) resumeVideo(); }, 35000);
            }
        });

        function resumeVideo() {
            isFrozen = false;
            video.classList.remove("frozen-glitch");
            video.play();
        }

        window.addEventListener('mousedown', (e) => {
            if (overlay.style.display === "none" && fred.style.display !== "block") {
                if (e.target.id !== "bg-video" && e.target.id !== "fps-display" && e.target.id !== "fps-num") {
                    video.pause();
                    scream.currentTime = 0;
                    scream.play();
                    scare.style.display = "block";
                    setTimeout(() => { window.location.href = "https://www.google.com"; }, 1800);
                } else if (e.target.id === "bg-video") {
                    isFrozen = false;
                    video.classList.remove("frozen-glitch");
                    video.currentTime = 0;
                    video.play();
                }
            }
        });

        function startFPSCounter() {
            setInterval(() => {
                if (isFrozen || fred.style.display === "block") return;
                fpsNum.innerText = Math.floor(Math.random() * (205 - 195 + 1)) + 195;
                fpsNum.style.color = "#00FF00";
            }, 100);
        }
    </script>
</body>
</html>
